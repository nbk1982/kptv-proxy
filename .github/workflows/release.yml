name: Release

on:
  push:
    tags: ["v*"]

# Never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gate as every other path: a tag whose tests fail publishes nothing.
  # The tag name is stamped into the binary as its version.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write # Needed to create the release and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reuse the exact binary CI already built and version-stamped rather
      # than compiling a second, subtly different one here.
      - name: Download binary built by CI
        uses: actions/download-artifact@v8
        with:
          name: kptv-proxy-linux-amd64-${{ github.sha }}

      - name: Package asset
        run: |
          # The artifact zip does not preserve the executable bit.
          chmod +x kptv-proxy
          ASSET="kptv-proxy_${GITHUB_REF_NAME}_linux_amd64"
          mv kptv-proxy "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          cat "$ASSET.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Treat any tag carrying a suffix (v1.2.3-rc1) as a prerelease.
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE=--prerelease ;;
            *) PRERELEASE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE \
            "$ASSET" "$ASSET.sha256"
